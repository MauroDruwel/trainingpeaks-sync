[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainingpeaks-sync"
version = "2.0.0"
description = "Multi-source workout aggregator & sync engine for TrainingPeaks (Strava, LAGO & StudentApp)"
readme = "README.md"
authors = [{name = "Mauro Druwel", email = "mauro.druwel@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "defusedxml>=0.7.1",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.0.0",
    "requests>=2.28.0",
    "scipy>=1.11.0",
    "tcxreader>=0.4.11",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
trainingpeaks-sync = "src.cli:main"
tp-sync = "src.cli:main"
strava-sync = "src.cli:main"
strava-to-trainingpeaks = "src.cli:main"
strava-coach-mode = "src.coach_sync:coach_mode_main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
